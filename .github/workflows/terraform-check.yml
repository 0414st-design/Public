name: "Terraform CI"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # 構文チェック（Linter）を行うジョブ
  lint:
    name: "Terraform Linter"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout"
        uses: actions/checkout@v4

      - name: "Setup Terraform"
        uses: hashicorp/setup-terraform@v3

      # terraform init を実行し、必要なプロバイダーをダウンロードする
      - name: "Terraform Init"
        run: terraform init

      # サブディレクトリ（modules/）も含めてフォーマットをチェックする
      - name: "Terraform Format Check"
        run: terraform fmt -check -recursive

      # コードの論理的な構文エラーがないか確認する
      - name: "Terraform Validate"
        run: terraform validate

      # TFLintでAWS固有のベストプラクティス違反を検出する
      # .tflint.hcl にプラグイン設定を記載しているため --init が必要
      - name: "Setup TFLint"
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: latest

      - name: "Run TFLint"
        run: |
          tflint --init
          tflint -f compact --recursive

  # セキュリティスキャンを行うジョブ
  # lintジョブが成功した後にのみ実行し、リソースの浪費を防ぐ
  security_scan:
    name: "Security Scan"
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: "Checkout code"
        uses: actions/checkout@v4

      # tfsecでTerraformコード内のセキュリティ不備を検出する
      # soft_fail: trueでlab段階では警告のみに留めてCIを中断させない
      - name: "Run tfsec"
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          soft_fail: true

      # Checkovでクラウドインフラのベストプラクティス違反を確認する
      # directory: . でルートから再帰的にスキャンしモジュール間の不備も検出する
      # バージョンを固定し再現性を担保する（dependabotが自動更新）
      - name: "Run Checkov"
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          soft_fail: true
          framework: terraform